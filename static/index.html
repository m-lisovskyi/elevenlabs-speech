<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speech · ElevenLabs</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙</text></svg>">
  <style>
    :root { color-scheme: light dark; --accent: #6b5cff; }
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    h1 { margin-bottom: .25rem; }
    .sub { opacity: .7; margin-top: 0; }
    .card { border: 1px solid #8884; border-radius: 12px; padding: 1rem 1.25rem; margin: 1rem 0; }
    .row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
    button { font: inherit; padding: .55rem 1.1rem; border-radius: 8px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    button.rec { background: #e5484d; }
    input[type=text] { font: inherit; padding: .4rem .6rem; width: 6rem; }
    #status { min-height: 1.5em; opacity: .8; }
    #transcript { white-space: pre-wrap; font-size: 1.1rem; }
    .speaker { font-weight: 600; color: var(--accent); }
    .event { opacity: .6; font-style: italic; }
    .meta { font-size: .85rem; opacity: .7; }
    button.live { background: #e5484d; }
    #live { white-space: pre-wrap; font-size: 1.1rem; min-height: 3em; margin-top: .75rem; }
    .partial { opacity: .5; }
    .tabs { display: flex; gap: .5rem; margin: 1rem 0; }
    .tabs button { background: transparent; color: inherit; border: 1px solid #8886; }
    .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    textarea { font: inherit; width: 100%; box-sizing: border-box; min-height: 9rem; padding: .6rem; border-radius: 8px; resize: vertical; }
    select { font: inherit; padding: .4rem .5rem; }
    input[type=range] { vertical-align: middle; }
    audio { width: 100%; margin-top: .75rem; }
  </style>
</head>
<body>
  <h1>Speech ⇄ Text</h1>
  <p class="sub">Powered by ElevenLabs</p>

  <div class="tabs">
    <button id="tabStt" class="active">🎙 Speech → Text</button>
    <button id="tabTts">🔊 Text → Speech</button>
  </div>

  <section id="sttTab">
  <div class="card">
    <h3 style="margin-top:0">⚡ Live (realtime)</h3>
    <div class="row">
      <button id="liveBtn">Start live transcription</button>
      <span id="liveState" class="meta"></span>
    </div>
    <div id="live"><span id="liveCommitted"></span><span id="livePartial" class="partial"></span></div>
  </div>

  <div class="card">
    <h3 style="margin-top:0">🎧 Record or upload (higher accuracy)</h3>
    <div class="row">
      <button id="recBtn">🎙 Start recording</button>
      <span id="timer"></span>
    </div>
    <p class="meta">…or upload an audio/video file:</p>
    <div class="row">
      <input type="file" id="fileInput" accept="audio/*,video/*">
      <button id="uploadBtn" disabled>Transcribe file</button>
    </div>
  </div>

  <div class="card row">
    <label>Language <input type="text" id="lang" placeholder="auto"></label>
    <label><input type="checkbox" id="diarize"> Identify speakers</label>
    <label><input type="checkbox" id="events" checked> Tag sounds (laughter, etc.)</label>
  </div>

  <div id="status"></div>

  <div class="card" id="resultCard" hidden>
    <div class="row" style="justify-content: space-between">
      <span class="meta" id="meta"></span>
      <button id="copyBtn">Copy</button>
    </div>
    <div id="transcript"></div>
  </div>
  </section>

  <section id="ttsTab" hidden>
  <div class="card">
    <textarea id="ttsText" maxlength="5000" placeholder="Type or paste text to speak…">Hello! This voice was generated by ElevenLabs. Pretty natural, right?</textarea>
    <div class="row meta" style="justify-content: flex-end"><span id="ttsCount"></span></div>
    <div class="row">
      <label>Voice <select id="ttsVoice"><option>Loading…</option></select></label>
      <label>Model <select id="ttsModel"></select></label>
    </div>
    <div class="row" style="margin-top: .5rem">
      <label>Speed <input type="range" id="ttsSpeed" min="0.7" max="1.2" step="0.05" value="1"> <span id="ttsSpeedVal">1.00×</span></label>
      <label>Stability <input type="range" id="ttsStability" min="0" max="1" step="0.05" value="0.5"> <span id="ttsStabilityVal">0.50</span></label>
    </div>
    <div class="row" style="margin-top: .75rem">
      <button id="ttsBtn">Generate speech</button>
      <a id="ttsDownload" hidden download="speech.mp3">⬇ Download MP3</a>
      <span id="ttsStatus" class="meta"></span>
    </div>
    <audio id="ttsAudio" controls hidden></audio>
  </div>
  </section>

<script>
const $ = id => document.getElementById(id);
const status = msg => { $("status").textContent = msg; };
let recorder, chunks = [], timerId, startedAt, lastText = "";

$("recBtn").onclick = async () => {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    status("Microphone access denied: " + e.message); return;
  }
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    clearInterval(timerId); $("timer").textContent = "";
    $("recBtn").textContent = "🎙 Start recording"; $("recBtn").classList.remove("rec");
    const type = recorder.mimeType || "audio/webm";
    const ext = type.includes("mp4") ? "m4a" : type.includes("ogg") ? "ogg" : "webm";
    transcribe(new File(chunks, `recording.${ext}`, { type }));
  };
  recorder.start();
  startedAt = Date.now();
  timerId = setInterval(() => {
    const s = Math.floor((Date.now() - startedAt) / 1000);
    $("timer").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  }, 250);
  $("recBtn").textContent = "⏹ Stop & transcribe"; $("recBtn").classList.add("rec");
  status("Recording…");
};

$("fileInput").onchange = () => { $("uploadBtn").disabled = !$("fileInput").files.length; };
$("uploadBtn").onclick = () => transcribe($("fileInput").files[0]);

$("copyBtn").onclick = async () => {
  await navigator.clipboard.writeText(lastText);
  $("copyBtn").textContent = "Copied!";
  setTimeout(() => { $("copyBtn").textContent = "Copy"; }, 1200);
};

async function transcribe(file) {
  const form = new FormData();
  form.append("file", file);
  form.append("language_code", $("lang").value);
  form.append("diarize", $("diarize").checked);
  form.append("tag_audio_events", $("events").checked);

  $("recBtn").disabled = $("uploadBtn").disabled = true;
  status(`Transcribing ${file.name} (${(file.size / 1024).toFixed(0)} KB)…`);
  try {
    const resp = await fetch("/api/transcribe", { method: "POST", body: form });
    const body = await resp.json();
    if (!resp.ok) throw new Error(errorMessage(body));
    render(body);
    status("");
  } catch (e) {
    status("Error: " + e.message);
  } finally {
    $("recBtn").disabled = false;
    $("uploadBtn").disabled = !$("fileInput").files.length;
  }
}

// ---------- Live (realtime) transcription ----------
// Mic -> AudioWorklet (Float32) -> 16-bit PCM base64 chunks (~100 ms) -> ElevenLabs WebSocket.
const REALTIME_URL = "wss://api.elevenlabs.io/v1/speech-to-text/realtime";
const SUPPORTED_RATES = [8000, 16000, 22050, 24000, 44100, 48000];
const WORKLET = `
class Tap extends AudioWorkletProcessor {
  process(inputs) { const ch = inputs[0][0]; if (ch) this.port.postMessage(ch.slice(0)); return true; }
}
registerProcessor("tap", Tap);`;

let live = null;  // { ws, ctx, stream, node, rate, buf, bufLen }

$("liveBtn").onclick = () => (live ? stopLive() : startLive());

function liveState(msg) { $("liveState").textContent = msg; }

async function startLive() {
  $("liveBtn").disabled = true;
  liveState("Connecting…");
  let stream, ctx;
  try {
    const tokResp = await fetch("/api/realtime-token", { method: "POST" });
    const tok = await tokResp.json();
    if (!tokResp.ok) throw new Error(errorMessage(tok));

    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 },
    });
    ctx = new AudioContext();
    await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "text/javascript" })));
    const node = new AudioWorkletNode(ctx, "tap");
    ctx.createMediaStreamSource(stream).connect(node);

    // Send at the native rate when the API supports it, otherwise resample to 16 kHz
    const rate = SUPPORTED_RATES.includes(ctx.sampleRate) ? ctx.sampleRate : 16000;
    const params = new URLSearchParams({
      model_id: "scribe_v2_realtime",
      token: tok.token,
      audio_format: `pcm_${rate}`,
      commit_strategy: "vad",
    });
    if ($("lang").value.trim()) params.set("language_code", $("lang").value.trim());
    const ws = new WebSocket(`${REALTIME_URL}?${params}`);

    live = { ws, ctx, stream, node, rate, buf: [], bufLen: 0, error: null };
    $("liveCommitted").textContent = "";
    $("livePartial").textContent = "";

    ws.onopen = () => {
      liveState("🔴 Listening — speak now");
      $("liveBtn").textContent = "Stop"; $("liveBtn").classList.add("live"); $("liveBtn").disabled = false;
    };
    ws.onmessage = e => handleLiveMessage(JSON.parse(e.data));
    ws.onclose = e => {
      if (live && live.ws === ws) teardownLive(live.error || (e.reason ? `Closed: ${e.reason}` : "Connection closed"));
    };
    node.port.onmessage = e => onAudioFrame(e.data, ctx.sampleRate);
  } catch (e) {
    stream?.getTracks().forEach(t => t.stop());
    ctx?.close().catch(() => {});
    teardownLive("Error: " + e.message);
  }
}

function onAudioFrame(frame, inRate) {
  if (!live || live.ws.readyState !== WebSocket.OPEN) return;
  const samples = inRate === live.rate ? frame : resample(frame, inRate, live.rate);
  live.buf.push(samples);
  live.bufLen += samples.length;
  if (live.bufLen >= live.rate / 10) sendChunk(false);  // ~100 ms per message
}

function sendChunk(commit) {
  const pcm = new Int16Array(live.bufLen);
  let off = 0;
  for (const part of live.buf) {
    for (let i = 0; i < part.length; i++) {
      const s = Math.max(-1, Math.min(1, part[i]));
      pcm[off++] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
  }
  live.buf = []; live.bufLen = 0;
  live.ws.send(JSON.stringify({
    message_type: "input_audio_chunk",
    audio_base_64: toBase64(pcm.buffer),
    commit,
    sample_rate: live.rate,
  }));
}

function handleLiveMessage(m) {
  switch (m.message_type) {
    case "session_started":
      break;
    case "partial_transcript":
      $("livePartial").textContent = m.text ? m.text + " " : "";
      break;
    case "committed_transcript":
      if (m.text) $("liveCommitted").textContent += m.text + " ";
      $("livePartial").textContent = "";
      break;
    case "warning":
      console.warn("Scribe warning:", m.warning);
      break;
    default:
      if (m.error) {
        if (live) live.error = `${m.message_type}: ${m.error}`;
        liveState(`${m.message_type}: ${m.error}`);
      }
  }
}

async function stopLive() {
  if (!live) return;
  const { ws } = live;
  $("liveBtn").disabled = true;
  liveState("Finishing…");
  live.node.port.onmessage = null;
  live.stream.getTracks().forEach(t => t.stop());
  // Flush the tail and force a final commit, then give the server a moment to answer
  if (ws.readyState === WebSocket.OPEN) {
    sendChunk(true);
    await new Promise(resolve => {
      const done = () => { clearTimeout(timer); resolve(); };
      const timer = setTimeout(done, 2000);
      ws.addEventListener("message", e => {
        if (JSON.parse(e.data).message_type === "committed_transcript") done();
      });
    });
  }
  teardownLive(live?.error || "Stopped");
}

function teardownLive(msg) {
  if (live) {
    const { ws, ctx, stream } = live;
    live = null;
    stream.getTracks().forEach(t => t.stop());
    ctx.close().catch(() => {});
    if (ws.readyState <= WebSocket.OPEN) ws.close();
  }
  // Keep any leftover partial text visible as part of the transcript
  const partial = $("livePartial").textContent;
  if (partial) { $("liveCommitted").textContent += partial; $("livePartial").textContent = ""; }
  $("liveBtn").textContent = "Start live transcription";
  $("liveBtn").classList.remove("live");
  $("liveBtn").disabled = false;
  liveState(msg);
}

function resample(input, inRate, outRate) {
  const ratio = inRate / outRate;
  const out = new Float32Array(Math.floor(input.length / ratio));
  for (let i = 0; i < out.length; i++) {
    const pos = i * ratio, j = Math.floor(pos), frac = pos - j;
    out[i] = input[j] + ((input[j + 1] ?? input[j]) - input[j]) * frac;
  }
  return out;
}

function toBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

// ---------- Tabs ----------
function showTab(name) {
  $("sttTab").hidden = name !== "stt";
  $("ttsTab").hidden = name !== "tts";
  $("tabStt").classList.toggle("active", name === "stt");
  $("tabTts").classList.toggle("active", name === "tts");
  if (name === "tts") loadTtsOptions();
}
$("tabStt").onclick = () => showTab("stt");
$("tabTts").onclick = () => showTab("tts");

// ---------- Text-to-speech ----------
let ttsOptionsLoaded = false, ttsAudioUrl = null;

async function loadTtsOptions() {
  if (ttsOptionsLoaded) return;
  try {
    const resp = await fetch("/api/tts/options");
    const body = await resp.json();
    if (!resp.ok) throw new Error(errorMessage(body));
    $("ttsVoice").innerHTML = "";
    for (const v of body.voices) $("ttsVoice").add(new Option(v.category ? `${v.name} (${v.category})` : v.name, v.voice_id));
    for (const m of body.models) $("ttsModel").add(new Option(m.name, m.model_id));
    ttsOptionsLoaded = true;
  } catch (e) {
    $("ttsStatus").textContent = "Couldn't load voices: " + e.message;
  }
}

const updateCount = () => { $("ttsCount").textContent = `${$("ttsText").value.length} / 5000`; };
$("ttsText").oninput = updateCount;
updateCount();
$("ttsSpeed").oninput = () => { $("ttsSpeedVal").textContent = Number($("ttsSpeed").value).toFixed(2) + "×"; };
$("ttsStability").oninput = () => { $("ttsStabilityVal").textContent = Number($("ttsStability").value).toFixed(2); };

$("ttsBtn").onclick = async () => {
  const text = $("ttsText").value.trim();
  if (!text) { $("ttsStatus").textContent = "Enter some text first"; return; }
  $("ttsBtn").disabled = true;
  $("ttsStatus").textContent = "Generating…";
  try {
    const resp = await fetch("/api/tts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        text,
        voice_id: $("ttsVoice").value,
        model_id: $("ttsModel").value,
        speed: Number($("ttsSpeed").value),
        stability: Number($("ttsStability").value),
      }),
    });
    if (!resp.ok) throw new Error(errorMessage(await resp.json()));
    if (ttsAudioUrl) URL.revokeObjectURL(ttsAudioUrl);
    ttsAudioUrl = URL.createObjectURL(await resp.blob());
    $("ttsAudio").src = ttsAudioUrl;
    $("ttsAudio").hidden = false;
    $("ttsAudio").play().catch(() => {});
    $("ttsDownload").href = ttsAudioUrl;
    $("ttsDownload").hidden = false;
    $("ttsStatus").textContent = "";
  } catch (e) {
    $("ttsStatus").textContent = "Error: " + e.message;
  } finally {
    $("ttsBtn").disabled = false;
  }
};

// FastAPI validation errors come as a list, ElevenLabs errors as {message}, ours as a string
function errorMessage(body) {
  const d = body.detail;
  if (typeof d === "string") return d;
  if (Array.isArray(d)) return d.map(x => x.msg).join("; ");
  return d?.message || JSON.stringify(d);
}

// ---------- Batch result rendering ----------
function render(r) {
  lastText = r.text || "";
  const out = $("transcript");
  out.innerHTML = "";
  const words = r.words || [];
  const hasSpeakers = words.some(w => w.speaker_id);

  if (!hasSpeakers) {
    // Plain text, with audio events styled
    for (const w of words.length ? words : [{ text: lastText, type: "word" }]) {
      const span = document.createElement("span");
      span.textContent = w.text;
      if (w.type === "audio_event") span.className = "event";
      out.appendChild(span);
    }
  } else {
    let current = null, line;
    for (const w of words) {
      if (w.speaker_id && w.speaker_id !== current) {
        current = w.speaker_id;
        line = document.createElement("div");
        const who = document.createElement("span");
        who.className = "speaker";
        who.textContent = current.replace("speaker_", "Speaker ") + ": ";
        line.appendChild(who);
        out.appendChild(line);
      }
      if (!line) { line = document.createElement("div"); out.appendChild(line); }
      const span = document.createElement("span");
      span.textContent = w.text;
      if (w.type === "audio_event") span.className = "event";
      line.appendChild(span);
    }
  }

  const lang = r.language_code ? `${r.language_code} (${Math.round((r.language_probability || 0) * 100)}%)` : "?";
  const dur = r.audio_duration_secs ? ` · ${r.audio_duration_secs.toFixed(1)}s audio` : "";
  $("meta").textContent = `Language: ${lang}${dur}`;
  $("resultCard").hidden = false;
}
</script>
</body>
</html>
